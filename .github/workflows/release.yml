name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag, Cargo.toml and npm/package.json name the same version
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          npm_version=$(node -p "require('./npm/package.json').version")
          if [ "v$cargo_version" != "$GITHUB_REF_NAME" ] || [ "$npm_version" != "$cargo_version" ]; then
            echo "tag $GITHUB_REF_NAME, Cargo.toml $cargo_version and npm/package.json $npm_version must agree"
            exit 1
          fi

  build:
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The pcsc crate links libpcsclite via pkg-config on Linux; macOS has the PCSC framework.
      - name: Install libpcsclite (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev pkg-config
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          tar czf sim-doctor-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release sim-doctor
          shasum -a 256 sim-doctor-${{ matrix.target }}.tar.gz > sim-doctor-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: sim-doctor-${{ matrix.target }}.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: artifacts
      - name: Flatten artifacts
        run: |
          cd artifacts
          for f in */*.tar.gz*; do mv "$f" "$(basename "$f")"; done
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/sim-doctor-*

  crates:
    # Trusted publishing: crates.io checks this workflow's OIDC identity against the publisher
    # configured on the crate (Vaibhav91one/sim-doctor, release.yml) and hands back a short-lived
    # token. CARGO_REGISTRY_TOKEN stays only as a fallback until an OIDC release has succeeded;
    # delete the secret and the fallback after that.
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libpcsclite
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev pkg-config
      - name: Exchange the OIDC identity for a short-lived crates.io token
        id: auth
        continue-on-error: true # not configured yet: fall back to the secret below
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::notice::no crates.io token (OIDC not configured, CARGO_REGISTRY_TOKEN not set); skipped publishing to crates.io"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          code=$(curl -s -o /dev/null -w '%{http_code}' -A "sim-doctor-release (github.com/Vaibhav91one/sim-doctor)" "https://crates.io/api/v1/crates/sim-doctor/$version")
          if [ "$code" = "200" ]; then
            echo "::notice::sim-doctor $version is already on crates.io; nothing to publish"
            exit 0
          fi
          cargo publish

  npm:
    # Trusted publishing: npm checks this workflow's OIDC identity against the publisher
    # configured on the package (Vaibhav91one/sim-doctor, release.yml). Needs npm 11.5.1 or
    # later. NPM_TOKEN stays only as a fallback until an OIDC release has succeeded.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing (and provenance)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Launcher tests
        working-directory: npm
        run: npm test
      - name: Publish the launcher
        working-directory: npm
        env:
          FALLBACK_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@latest
          version=$(node -p "require('./package.json').version")
          if [ "$(npm view "sim-doctor@$version" version 2>/dev/null)" = "$version" ]; then
            echo "::notice::sim-doctor@$version is already on npm; nothing to publish"
            exit 0
          fi
          if npm publish --access public; then
            exit 0
          fi
          if [ -z "$FALLBACK_NPM_TOKEN" ]; then
            echo "::error::trusted publishing failed and no NPM_TOKEN fallback is set"
            exit 1
          fi
          echo "::warning::trusted publishing failed; retrying with the NPM_TOKEN secret"
          NODE_AUTH_TOKEN="$FALLBACK_NPM_TOKEN" npm publish --access public --provenance
