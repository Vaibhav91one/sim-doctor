name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The pcsc crate links libpcsclite via pkg-config on Linux; macOS has the PCSC framework.
      - name: Install libpcsclite (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev pkg-config
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: tar czf sim-doctor-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release sim-doctor
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: sim-doctor-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: artifacts
      - name: Flatten artifacts
        run: |
          cd artifacts
          for f in */*.tar.gz; do mv "$f" "$(basename "$f")"; done
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
