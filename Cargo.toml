[package]
name = "sim-doctor"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "CLI-first SIM/UICC/eUICC security testing tool: scans a card over PC/SC and reports findings as a table or one stable JSON envelope"
license = "MIT"
repository = "https://github.com/Vaibhav91one/sim-doctor"
homepage = "https://github.com/Vaibhav91one/sim-doctor"
readme = "README.md"
keywords = ["sim", "uicc", "euicc", "smartcard", "security"]
categories = ["command-line-utilities", "hardware-support"]
exclude = [".issues/", ".github/", "npm/", "docs/assets/"]

[dependencies]
# --- Smartcard transport ---
pcsc    = "2.9.0"   # PC/SC reader bindings (SCard* API). STALE: last publish 2024-12-14
iso7816 = "0.2.1"   # APDU types. 0.x - unstable API

# --- SIM crypto ---
milenage = "0.3.1"  # MIL-ENAGE KDF, f1-f5/f5*, auth responses

# --- Symmetric / hash primitives ---
aes  = "0.9.3"      # 0.9.0 is YANKED
des  = "0.9.0"      # DES/3DES for legacy GSM
cbc  = "0.2.1"
cmac = "0.8.0"      # AES-CMAC / DES-CMAC (SCP03, GSM auth)
sha2 = "0.11.0"
hmac = "0.13.0"
sha3 = "0.12.0"

# --- ECC (SGP.22 SCP03t) ---
p256  = "0.14.0"    # NIST P-256, otPK/otSK .ECKA
ecdsa = "0.17.0"    # RFC 6979 deterministic signing

# --- ASN.1 / DER ---
# WARNING: der is STRICT DER only and will NOT parse BER-TLV BPP payloads.
# BER-TLV for SIM files and SGP.22 payloads is src/tlv.rs, hand-rolled: see the
# module documentation for why neither iso7816-tlv nor flexiber was adopted.
# Keep der for certificates only. src/der.rs is the strict path inside this
# crate, as a separate type so the two cannot be confused.
der = "0.8.2"       # 0.8.0 is YANKED
oid = "0.3.0"

# --- CLI / TUI ---
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
ratatui = "0.30.2"
crossterm = "0.29.0"   # 0.28.0 is YANKED
owo-colors = "4.4.0"   # zero-alloc, best fit with ratatui

# --- Serialization / errors ---
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
thiserror = "2.0.21"

# --- Logging / util ---
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
libc = "0.2.190"      # POSIX signal(2) for the SIGINT handler in src/signals.rs.
                      # NOT a new package in the tree: libc 0.2.190 is already in
                      # Cargo.lock via pcsc and the crypto stack, so this only
                      # adds a direct edge, not a download.
hex = "0.4.3"
bytes = "1.12.1"
rand = "0.10.3"      # MAJOR LINE JUMP 0.8->0.9->0.10 - see AGENTS.md warning
chrono = "0.4.45"
regex = "1.13.1"   # TAR selection patterns for --tar regex:PATTERN. NOT a new package

[dependencies.tokio]
version = "1.53.2"
optional = true

[features]
default = []
remote  = ["dep:tokio"]   # only for remote-SIM / ATC-UICCS; pure PC/SC is sync

# Opt-in gate for the software-card fixture added by issue #4. OFF by default,
# so a plain `cargo test` needs no reader, no pcscd and no swSIM: with this
# feature off, tests/card_fixture.rs compiles to nothing at all.
#
# Turn it on to run the card-backed test against a live swSIM card:
#     cargo test --features card-fixture --test card_fixture -- --ignored --nocapture
#
# The test is additionally marked `#[ignore]` so that even
# `cargo test --all-features` stays green on a laptop with no reader. See
# docs/swsim-fixture.md for the full fixture and local reproduction steps.
card-fixture = []
